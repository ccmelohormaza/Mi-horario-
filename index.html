<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="theme-color"
        content="#0f1117">

    <title>Mis Horarios</title>

    <link
        rel="manifest"
        href="manifest.json">

    <link
        rel="stylesheet"
        href="styles.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


    <!-- =====================================================
         PANTALLA DE LOGIN
         ===================================================== -->

    <section
        id="authScreen"
        class="auth-screen">

        <div class="auth-card">

            <div class="auth-logo">
                📅
            </div>

            <h1>
                Mis Horarios
            </h1>

            <p>
                Tus horarios en todos tus dispositivos.
            </p>


            <!-- LOGIN -->

            <form id="loginForm">

                <div class="form-group">

                    <label>
                        Correo
                    </label>

                    <input
                        id="loginEmail"
                        type="email"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Contraseña
                    </label>

                    <input
                        id="loginPassword"
                        type="password"
                        placeholder="Contraseña"
                        required>

                </div>


                <button
                    class="btn btn-primary btn-full"
                    type="submit">

                    Iniciar sesión

                </button>

            </form>


            <div class="auth-separator">
                <span>o</span>
            </div>


            <!-- REGISTRO -->

            <form id="registerForm">

                <div class="form-group">

                    <label>
                        Nombre
                    </label>

                    <input
                        id="registerName"
                        type="text"
                        placeholder="Tu nombre"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Correo
                    </label>

                    <input
                        id="registerEmail"
                        type="email"
                        placeholder="correo@ejemplo.com"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Contraseña
                    </label>

                    <input
                        id="registerPassword"
                        type="password"
                        placeholder="Mínimo 6 caracteres"
                        minlength="6"
                        required>

                </div>


                <button
                    class="btn btn-secondary btn-full"
                    type="submit">

                    Crear cuenta

                </button>

            </form>


            <p
                id="authMessage"
                class="auth-message">
            </p>

        </div>

    </section>



    <!-- =====================================================
         APLICACIÓN
         ===================================================== -->

    <div
        id="appScreen"
        class="app-screen hidden">


        <!-- CABECERA -->

        <header class="app-header">

            <div>

                <h1>
                    📅 Mis Horarios
                </h1>

                <p id="userName">
                    Usuario
                </p>

            </div>


            <button
                id="btnLogout"
                class="btn btn-secondary">

                Cerrar sesión

            </button>

        </header>



        <!-- CONTENIDO -->

        <main class="container">


            <!-- SELECTOR DE HORARIOS -->

            <section class="toolbar">

                <div class="selector-container">

                    <label>
                        Horario actual
                    </label>

                    <select
                        id="selectorHorario">
                    </select>

                </div>


                <div class="toolbar-actions">

                    <button
                        id="btnNuevoHorario"
                        class="btn btn-primary">

                        + Nuevo horario

                    </button>


                    <button
                        id="btnEliminarHorario"
                        class="btn btn-danger">

                        🗑 Eliminar

                    </button>

                </div>

            </section>



            <!-- INFORMACIÓN DEL HORARIO -->

            <section class="schedule-info">

                <div>

                    <h2 id="nombreHorario">
                        Sin horario
                    </h2>

                    <p id="descripcionHorario">
                        Crea tu primer horario.
                    </p>

                </div>


                <button
                    id="btnAgregarMateria"
                    class="btn btn-primary">

                    + Agregar materia

                </button>

            </section>



            <!-- CALENDARIO -->

            <section class="schedule-wrapper">

                <div
                    id="schedule"
                    class="schedule">
                </div>

            </section>

        </main>

    </div>



    <!-- =====================================================
         MODAL PARA CREAR HORARIO
         ===================================================== -->

    <div
        id="modalHorario"
        class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2>
                    Nuevo horario
                </h2>

                <button
                    class="btn-close"
                    data-close="modalHorario">

                    ×

                </button>

            </div>


            <form id="formHorario">

                <div class="form-group">

                    <label>
                        Nombre
                    </label>

                    <input
                        id="nombreNuevoHorario"
                        type="text"
                        placeholder="Ingeniería Civil 2026-2"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Descripción
                    </label>

                    <textarea
                        id="descripcionNuevoHorario"
                        placeholder="Descripción">
                    </textarea>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-close="modalHorario">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Guardar

                    </button>

                </div>

            </form>

        </div>

    </div>



    <!-- =====================================================
         MODAL PARA CREAR / EDITAR MATERIA
         ===================================================== -->

    <div
        id="modalMateria"
        class="modal hidden">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="tituloModalMateria">
                    Nueva materia
                </h2>

                <button
                    class="btn-close"
                    data-close="modalMateria">

                    ×

                </button>

            </div>


            <form id="formMateria">


                <input
                    type="hidden"
                    id="materiaId">


                <div class="form-group">

                    <label>
                        Materia
                    </label>

                    <input
                        id="nombreMateria"
                        type="text"
                        placeholder="Estructuras"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Curso / Grupo
                    </label>

                    <input
                        id="cursoMateria"
                        type="text"
                        placeholder="Grupo A">

                </div>


                <div class="form-group">

                    <label>
                        Profesor
                    </label>

                    <input
                        id="profesorMateria"
                        type="text"
                        placeholder="Nombre del profesor">

                </div>


                <div class="form-group">

                    <label>
                        Salón / Lugar
                    </label>

                    <input
                        id="salonMateria"
                        type="text"
                        placeholder="Aula 302">

                </div>


                <div class="form-group">

                    <label>
                        Día
                    </label>

                    <select id="diaMateria">

                        <option value="lunes">
                            Lunes
                        </option>

                        <option value="martes">
                            Martes
                        </option>

                        <option value="miercoles">
                            Miércoles
                        </option>

                        <option value="jueves">
                            Jueves
                        </option>

                        <option value="viernes">
                            Viernes
                        </option>

                        <option value="sabado">
                            Sábado
                        </option>

                        <option value="domingo">
                            Domingo
                        </option>

                    </select>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Hora inicio
                        </label>

                        <input
                            id="horaInicio"
                            type="time"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Hora fin
                        </label>

                        <input
                            id="horaFin"
                            type="time"
                            required>

                    </div>

                </div>


                <div class="form-group">

                    <label>
                        Color
                    </label>

                    <input
                        id="colorMateria"
                        type="color"
                        value="#6366f1">

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-close="modalMateria">

                        Cancelar

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Guardar materia

                    </button>

                </div>

            </form>

        </div>

    </div>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="supabase.js"></script>

    <script src="app.js"></script>



    <!-- SERVICE WORKER -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker.register(
                        "sw.js"
                    );

                }
            );

        }

    </script>


</body>

</html>
